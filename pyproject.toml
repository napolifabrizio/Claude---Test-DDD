[project]
name = "claude_ddd"
version = "0.1.0"
description = "Claude Test DDD"
authors = [
    {name = "napolifabrizio"}
]
readme = "README.md"
requires-python = "3.11.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]


[tool.poetry]
name = "claude_ddd"
packages = [{include = "claude_ddd", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.0)"
]
